# Render Free Plan Deployment Configuration
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: brand-studio-agent
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Stripe Production Keys - obtenlos del Dashboard de Stripe en Live mode
      # Webhook endpoint: https://brand-studio-agent.onrender.com/api/stripe/webhook
      # Ver PRODUCTION_STRIPE_SETUP.md para instrucciones detalladas
      - key: STRIPE_SECRET_KEY
        sync: false  # sk_live_... del Dashboard de Stripe
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false  # pk_live_... del Dashboard de Stripe
      - key: STRIPE_WEBHOOK_SECRET
        sync: false  # whsec_live_... de la configuración de Webhooks de Stripe

      # AssemblyAI - pega la key real en el panel de Render, nunca uses generateValue
      # Render generaría un secreto aleatorio, config.py lo daría por válido
      # (no está vacío) y el servicio arrancaría en verde para fallar silenciosamente
      # en cada llamada a AssemblyAI. Fallo ruidoso al arrancar es mejor que silencioso.
      - key: ASSEMBLYAI_API_KEY
        sync: false
      # Sin esto, los print() del arranque se quedan en el buffer y el
      # aviso de "sin Supabase, estado en memoria" no aparece en el log.
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: RATE_LIMIT_REQUESTS_PER_MINUTE
        value: "30"
      - key: INITIAL_SESSION_CREDITS
        value: "500"
      - key: MAX_SESSION_DURATION_SECONDS
        value: "3600"
      - key: PAYMENT_URL
        value: "https://example.com/upgrade"
      - key: STT_LANGUAGE
        value: "es"
      - key: SUPABASE_URL
        sync: false  # Set in Render dashboard, not in repo
      - key: SUPABASE_KEY
        sync: false  # Set in Render dashboard, not in repo
      - key: PYTHON_VERSION
        value: "3.12.10"  # Render usaba 3.14; los tests se verificaron en 3.12
    plan: free  # Free tier
