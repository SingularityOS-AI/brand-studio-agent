# Render Free Plan Deployment Configuration
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: brand-studio-agent
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ASSEMBLYAI_API_KEY
        generateValue: true  # Render will generate a secret
        sync: false
      - key: RATE_LIMIT_REQUESTS_PER_MINUTE
        value: "30"
      - key: INITIAL_SESSION_CREDITS
        value: "500"
      - key: MAX_SESSION_DURATION_SECONDS
        value: "3600"
      - key: PAYMENT_URL
        value: "https://example.com/upgrade"
      - key: SUPABASE_URL
        sync: false  # Set in Render dashboard, not in repo
      - key: SUPABASE_KEY
        sync: false  # Set in Render dashboard, not in repo
    plan: free  # Free tier
