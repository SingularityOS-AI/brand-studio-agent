<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: radial-gradient(ellipse at center, #1a1f2e 0%, #0d1017 100%);
        font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 80px;
      }
      .stat-container {
        text-align: center;
        width: 100%;
      }
      .stat-number {
        font-family: "Space Grotesk", Inter, sans-serif;
        font-size: 280px;
        font-weight: 700;
        color: #2B4CD8;
        line-height: 1;
        letter-spacing: -0.03em;
        margin-bottom: 24px;
      }
      .stat-label {
        font-size: 64px;
        font-weight: 600;
        color: #E7EAF0;
        line-height: 1.2;
        letter-spacing: -0.01em;
      }
      .accent-line {
        width: 120px;
        height: 6px;
        background: linear-gradient(90deg, #2B4CD8, #6E86EE);
        border-radius: 3px;
        margin: 40px auto;
      }
      .brand-mark {
        position: absolute;
        bottom: 60px;
        left: 50%;
        transform: translateX(-50%);
        width: 32px;
        height: 32px;
        background: #2B4CD8;
        border-radius: 8px;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div class="stat-container" data-composition-id="stat" data-start="0" data-duration="{{DURATION_S}}" data-width="1080" data-height="1920">
      <div class="stat-number clip" data-start="0" data-duration="{{DURATION_S}}" data-track-index="0">{{VALUE}}</div>
      <div class="accent-line clip" data-start="0.3" data-duration="{{DURATION_S}}" data-track-index="1"></div>
      <div class="stat-label clip" data-start="0.5" data-duration="{{DURATION_S}}" data-track-index="2">{{HEADLINE}}</div>
      <div class="brand-mark clip" data-start="0.8" data-duration="{{DURATION_S}}" data-track-index="3"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Extract numeric value for animation
      const statNumber = document.querySelector('.stat-number');
      const rawValue = statNumber.textContent.trim();
      const numericMatch = rawValue.match(/^([0-9.,]+)/);
      const suffix = rawValue.replace(/^[0-9.,]+/, '').trim();

      if (numericMatch) {
        const targetNum = parseFloat(numericMatch[1].replace(/,/g, ''));
        const isFloat = numericMatch[1].includes('.') || numericMatch[1].includes(',');
        const duration = Math.min({{DURATION_S}} * 0.5, 2.5);

        statNumber.textContent = '0' + suffix;

        const counterObj = { value: 0 };
        gsap.set(statNumber, { scale: 0.8, opacity: 0 });

        tl.to(counterObj, {
          value: targetNum,
          duration: duration,
          ease: 'power2.out',
          onUpdate: function() {
            let displayVal;
            if (isFloat) {
              displayVal = counterObj.value.toFixed(1);
            } else {
              displayVal = Math.round(counterObj.value).toLocaleString();
            }
            statNumber.textContent = displayVal + suffix;
          }
        }, 0.2);

        tl.to(statNumber, {
          scale: 1,
          opacity: 1,
          duration: 0.6,
          ease: 'back.out(1.7)'
        }, 0.2);
      } else {
        gsap.set(statNumber, { y: 60, opacity: 0 });
        tl.to(statNumber, { y: 0, opacity: 1, duration: 0.8, ease: 'power3.out' }, 0.2);
      }

      // Accent line animation
      gsap.set('.accent-line', { scaleX: 0, opacity: 0 });
      tl.to('.accent-line', { scaleX: 1, opacity: 1, duration: 0.5, ease: 'power2.out' }, 0.3);

      // Label fade in
      const statLabel = document.querySelector('.stat-label');
      gsap.set('.stat-label', { y: 40, opacity: 0 });
      tl.to('.stat-label', { y: 0, opacity: 1, duration: 0.7, ease: 'power2.out' }, 0.5);

      // Brand mark fade in
      gsap.set('.brand-mark', { opacity: 0, y: 20 });
      tl.to('.brand-mark', { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 0.8);

      window.__timelines['stat'] = tl;
    </script>
  </body>
</html>
