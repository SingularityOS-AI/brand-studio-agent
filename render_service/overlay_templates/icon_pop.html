<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Icon Pop Overlay</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: transparent;
      font-family: sans-serif;
    }

    #icon-pop-root {
      position: absolute;
      width: 1080px;
      height: 1920px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #icon-container {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
    }

    #icon-text {
      line-height: 1;
      font-weight: normal;
    }
  </style>
</head>
<body>
  <div id="icon-pop-root" data-composition-id="icon_pop" data-duration="1.2">
    <div id="icon-container">
      <div id="icon-text"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script>
    (function() {
      // Params will be injected by render service
      window.__params = window.__params || {};

      // Get params with defaults
      const params = window.__params;
      const text = params.text || '✨';
      const x = params.x || 0;
      const y = params.y || 0;
      const w = params.w || 300;
      const h = params.h || 300;
      const brandSoul = params.brandSoul || {};
      const color = brandSoul.color || '#FFFFFF';
      const accent = brandSoul.accent || '#FFD700';

      // Get elements
      const root = document.getElementById('icon-pop-root');
      const container = document.getElementById('icon-container');
      const iconText = document.getElementById('icon-text');

      // Position container within bounds
      container.style.left = (x + w / 2) + 'px';
      container.style.top = (y + h / 2) + 'px';
      container.style.width = w + 'px';
      container.style.height = h + 'px';

      // Set icon text and style
      iconText.textContent = text;
      iconText.style.color = accent;
      iconText.style.textAlign = 'center';
      iconText.style.whiteSpace = 'nowrap';

      // Text fit: K=0.58, shrink 2px, min 28px, max 1 line
      function fitText() {
        const maxWidth = w;
        const initialFontSize = Math.min(h * 0.58, maxWidth * 0.58);
        const minFontSize = 28;

        let fontSize = initialFontSize;
        iconText.style.fontSize = fontSize + 'px';

        // Measure text width
        const actualWidth = iconText.offsetWidth;
        
        // Shrink if overflow
        while (actualWidth > maxWidth && fontSize > minFontSize) {
          fontSize -= 2;
          iconText.style.fontSize = fontSize + 'px';
        }

        // Enforce minimum
        if (fontSize < minFontSize) {
          iconText.style.fontSize = minFontSize + 'px';
          iconText.style.overflow = 'hidden';
          iconText.style.textOverflow = 'ellipsis';
        }
      }

      // Apply text fit immediately and after font load
      fitText();

      // Create timeline
      const tl = gsap.timeline({ paused: true });

      // Entrance: scale spring pop from 0 -> 1.2 -> 1.0, <= 0.8s
      tl.fromTo(container,
        { scale: 0, opacity: 0 },
        { 
          scale: 1.2, 
          opacity: 1, 
          duration: 0.5, 
          ease: 'back.out(1.7)' 
        }
      )
      .to(container,
        { 
          scale: 1.0, 
          duration: 0.3, 
          ease: 'power2.out' 
        }
      );

      // Optional rotation/bounce for emphasis
      tl.to(iconText,
        {
          scale: 1.1,
          duration: 0.15,
          ease: 'power1.out',
          yoyo: true,
          repeat: 1
        },
        '-=0.15'
      );

      // Hold
      tl.to(container,
        {
          duration: 0.2
        }
      );

      // Exit: shrink to 0, <= 0.4s
      tl.to(container,
        {
          scale: 0,
          opacity: 0,
          duration: 0.35,
          ease: 'power2.in'
        }
      );

      // Export timeline
      window.__timelines = window.__timelines || {};
      window.__timelines.main = tl;
    })();
  </script>
</body>
</html>
