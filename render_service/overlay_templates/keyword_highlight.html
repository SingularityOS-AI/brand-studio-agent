<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyword Highlight</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: transparent;
            overflow: hidden;
            aspect-ratio: 9 / 16;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
        }

        .highlight-box {
            background: rgba(255, 107, 107, 0.2);
            padding: 12px 20px;
            border-radius: 12px;
            position: relative;
        }

        .text-content {
            font-weight: 700;
            line-height: 1.4;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="highlight-box" id="highlightBox">
            <div class="text-content" id="textContent"></div>
        </div>
    </div>

    <script src="gsap.min.js"></script>
    <script>
        // Retrieve params from window.__params
        const params = window.__params || {};
        const text = params.text || "Keyword";
        const brandSoul = params.brandSoul || {
            color: "#000000",
            accent: "#FF6B6B",
            font: "Inter"
        };

        const highlightBox = document.getElementById('highlightBox');
        const textContent = document.getElementById('textContent');

        textContent.textContent = text;
        textContent.style.color = brandSoul.color;
        textContent.style.fontFamily = brandSoul.font;
        highlightBox.style.fontFamily = brandSoul.font;

        // Convert accent hex to RGBA with 0.2 opacity
        const hexToRgba = (hex, alpha) => {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        };

        highlightBox.style.background = hexToRgba(brandSoul.accent, 0.2);

        // Apply E2-04 text fit rule
        const availableWidth = params.w || 800;
        const availableHeight = params.h || 150;
        const K = 0.58;

        // Split text into words for line calculation
        const words = text.trim().split(/\s+/);
        const totalChars = words.join('').length;

        // Initial font size calculation
        let fontSize = Math.min(72, Math.floor(availableWidth / (K * Math.max(1, totalChars))));

        // Shrink rule: reduce by 2px steps until fit
        textContent.style.fontSize = fontSize + 'px';
        textContent.style.whiteSpace = 'pre-wrap';

        let lines = textContent.textContent.split('\n');
        
        // Force reflow to measure
        textContent.offsetHeight;

        // Check if fits in bounds with max 3 lines
        while ((textContent.offsetHeight > availableHeight || lines.length > 3) && fontSize > 28) {
            fontSize -= 2;
            if (fontSize < 28) fontSize = 28;
            textContent.style.fontSize = fontSize + 'px';
            textContent.offsetHeight; // Force reflow
        }

        // Ensure minimum font size
        if (fontSize < 28) fontSize = 28;
        textContent.style.fontSize = fontSize + 'px';

        // Determine lines (simple word wrapping)
        const maxTextWidth = availableWidth - 40; // Account for padding
        let lineText = '';
        const textLines = [];
        
        words.forEach((word, index) => {
            const testText = lineText + (lineText ? ' ' : '') + word;
            textContent.textContent = testText;
            
            if (textContent.offsetWidth > maxTextWidth) {
                if (lineText) {
                    textLines.push(lineText);
                }
                lineText = word;
            } else {
                lineText = testText;
            }
            
            if (index === words.length - 1) {
                textLines.push(lineText);
            }
        });

        // Limit to max 3 lines, truncate with ellipsis if needed
        const maxLines = Math.min(textLines.length, 3);
        let displayText = textLines.slice(0, maxLines).join('\n');
        
        if (textLines.length > 3) {
            displayText = textLines.slice(0, 2).join('\n') + '\n...';
        }

        textContent.textContent = displayText;

        // Center position
        const x = params.x || 540;
        const y = params.y || 960;
        
        const container = document.querySelector('.container');
        container.style.left = x + 'px';
        container.style.top = y + 'px';
        container.style.transform = 'translate(-50%, -50%)';
        container.style.position = 'absolute';

        // Create paused GSAP timeline
        const tl = gsap.timeline({ paused: true });

        // Entrance animation (<= 0.8s)
        // Highlight box expands from center
        tl.from(highlightBox, {
            scaleX: 0,
            scaleY: 0,
            opacity: 0,
            duration: 0.5,
            ease: "back.out(1.5)"
        })
        // Text scales in with bounce
        .from(textContent, {
            scale: 0.5,
            opacity: 0,
            duration: 0.6,
            ease: "back.out(1.7)"
        }, "-=0.3");

        // Exit animation (<= 0.4s)
        tl.to(textContent, {
            scale: 0.8,
            opacity: 0,
            duration: 0.3,
            ease: "power2.in"
        })
        .to(highlightBox, {
            scaleX: 0.5,
            scaleY: 0.5,
            opacity: 0,
            duration: 0.35,
            ease: "power2.in"
        }, "-=0.2");

        // Export timeline globally
        window.__timelines = { main: tl };
    </script>
</body>
</html>
